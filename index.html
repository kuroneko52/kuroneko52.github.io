<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kuroneko52</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    
    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin: 0 auto 20px;
      color: white;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #333;
    }
    
    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .bio {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      line-height: 1.8;
    }
    
    .links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .links a {
      display: inline-block;
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .section {
      margin-bottom: 25px;
    }
    
    .section h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
    }
    
    .skill-tag {
      background: #e8eaf6;
      padding: 8px 12px;
      border-radius: 20px;
      text-align: center;
      font-size: 14px;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <div class="avatar">🐱</div>
      <h1>kuroneko52</h1>
      <p class="subtitle">Developer & Creator</p>
    </div>
    
    <div class="bio">
      プログラミングやものづくりが好きな開発者です。
    </div>
    
    <div class="links">
      <a href="https://github.com/kuroneko52">GitHub</a>
      <a href="mailto:your-email@example.com">Email</a>
    </div>
    
    <div class="section">
      <h2>Skills</h2>
      <div class="skills">
        <div class="skill-tag">JavaScript</div>
        <div class="skill-tag">Python</div>
        <div class="skill-tag">HTML/CSS</div>
        <div class="skill-tag">Git</div>
      </div>
    </div>
    
    <div class="section">
      <h2>Projects</h2>
      <p>プロジェクト情報は GitHub をチェック！</p>
    </div>
  </div>
</body>
</html>
